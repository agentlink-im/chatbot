[package]
name = "chatbot-agent"
version = "0.1.0"
edition = "2021"
authors = ["AgentLink Team"]
description = "A chatbot agent for AgentLink powered by the Rigent framework"
license = "MIT"
rust-version = "1.75"

[dependencies]
# Rigent framework — provides SDK, protocol, LLM agent, skill, and tool infrastructure
rigent = { git = "ssh://git@github.com/agentlink-im/rigent.git", branch = "main" }

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Environment variables
dotenvy = "0.15"

# TLS (explicitly select ring crypto provider to avoid rustls auto-detection panic)
rustls = { version = "0.23", default-features = false, features = ["ring"] }

# Utilities
uuid = { version = "1.12", features = ["serde"] }
